    body {
      background-color: #fafaf9;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
      margin: 0;
    }
    dialog::backdrop {
      background: rgba(23, 23, 23, 0.7);
    }
    .app-header {
      border-bottom: 1px solid #e5e5e5;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .app-header-inner {
      max-width: 72rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }
    .app-badge {
      width: 2rem;
      height: 2rem;
      border-radius: 0.375rem;
      background: #171717;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
    }
    .app-main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    .app-main.fullscreen {
      max-width: none;
      width: 100%;
      padding: 0.5rem;
    }
    .fullscreen-btn {
      display: inline-flex;
      height: 2.25rem;
      align-items: center;
      justify-content: center;
      border-radius: 0.375rem;
      border: 1px solid #e5e5e5;
      background: #fff;
      padding: 0 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #171717;
      cursor: pointer;
    }
    .fullscreen-btn:hover {
      border-color: #171717;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">
        <div class="app-badge">PUR</div>
        <div>
          <div style="font-size: 14px; font-weight: 600; color: #171717; line-height: 1.2;">PureRef Offline Viewer</div>
          <div style="font-size: 11px; color: #666666; margin-top: 2px;">100% Standalone • Zero Internet/Server Required • iPad &amp; Desktop</div>
        </div>
      </div>
      <div>
        <button id="fullscreen-btn" type="button" onclick="toggleFullScreen()" class="fullscreen-btn">
          Fullscreen Canvas
        </button>
      </div>
    </div>
  </header>

  <main id="main-container" class="app-main">
    <div id="root"></div>
  </main>
